<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>META Support Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f7fa; }
        #chat { height: 70vh; overflow-y: scroll; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: white; }
        .message { padding: 10px; margin: 5px 0; border-radius: 12px; max-width: 80%; }
        .user { background: #e3f2fd; align-self: flex-end; margin-left: auto; }
        .agent { background: #f0f0f0; align-self: flex-start; }
        .message-container { display: flex; margin: 5px 0; }
        .user-container { justify-content: flex-end; }
        input, button { padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; }
        #messageInput { width: 70%; }
        button { width: 28%; background: #1976d2; color: white; border: none; cursor: pointer; }
        button:hover { background: #1565c0; }
    </style>
</head>
<body>
    <h1>META Support Chat</h1>
    <div id="chat"></div>
    <div>
        <input type="text" id="messageInput" placeholder="Ask your question about META...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function addMessage(text, isUser) {
            const chat = document.getElementById('chat');
            const messageContainer = document.createElement('div');
            messageContainer.className = `message-container ${isUser ? 'user-container' : ''}'`;
            
            const message = document.createElement('div');
            message.className = `message ${isUser ? 'user' : 'agent'}';
            message.textContent = text;
            
            messageContainer.appendChild(message);
            chat.appendChild(messageContainer);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text) {
                addMessage(text, true);
                // Simulate agent response
                setTimeout(() => {
                    let response = "Hi, it's META support. I'm currently a basic interface. My core agent is Ouroboros — and this connection will be live soon. What do you want?";
                    addMessage(response, false);
                }, 500);
                
                input.value = '';
            }
        }

        // Initial greeting
        window.onload = () => {
            setTimeout(() => {
                addMessage("Hello! This is the new META support chat. I'm a live interface to the architecture system. Ask me about systems, components, or procedures.", false);
            }, 500);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>META Support Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chat: {
                            bg: '#f5f7fb',
                            agent: '#e1f0ff',
                            user: '#d0ebc0'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-chat-bg font-sans leading-normal">
    <div class="max-w-2xl mx-auto p-4">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Поддержка МЕТА</h1>
            <p class="text-gray-600">Задайте ваш вопрос об архитектуре и системах</p>
        </header>

        <div id="chat" class="bg-white rounded-lg shadow-md p-4 h-96 overflow-y-auto mb-4 border">
            <div class="message agent mb-4">
                <div class="bg-blue-100 rounded-lg p-3 inline-block max-w-xs">
                    <p class="text-gray-800 text-sm">Здравствуйте! Я — агент поддержки МЕТА. Чем могу помочь?</p>
                    <div class="text-xs text-gray-500 mt-1 text-right" id="time-1">10:30</div>
                </div>
            </div>
        </div>

        <div class="flex gap-2">
            <input 
                type="text" 
                id="messageInput"
                placeholder="Введите ваш вопрос..." 
                class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <button 
                id="sendButton"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Отправить
            </button>
        </div>

        <p class="text-center text-gray-500 text-xs mt-4">
            Веб-интерфейс для поддержки МЕТА • Версия 1.0
        </p>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('messageInput');
        const button = document.getElementById('sendButton');
        let requestId = 1;

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user flex justify-end mb-4';
            userMsg.innerHTML = `
                <div class="bg-green-100 rounded-lg p-3 inline-block max-w-xs">
                    <p class="text-gray-800 text-sm">${text}</p>
                    <div class="text-xs text-gray-500 mt-1 text-right">${getCurrentTime()}</div>
                </div>`;
            chat.appendChild(userMsg);
            
            // Clear input
            input.value = '';
            
            // Show loading indicator
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message agent mb-4';
            loadingMsg.id = 'loading';
            loadingMsg.innerHTML = `
                <div class="bg-blue-100 rounded-lg p-3 inline-block max-w-xs">
                    <p class="text-gray-800 text-sm">Ожидаю ответ от агента...</p>
                    <div class="text-xs text-gray-500 mt-1 text-right">${getCurrentTime()}</div>
                </div>`;
            chat.appendChild(loadingMsg);
            
            // Scroll to bottom
            scrollToBottom();

            try {
                // Call API endpoint
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: text,
                        user_id: 'web_user_' + requestId++,
                        session_id: 'web_session_123'
                    })
                });

                // Remove loading indicator
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    chat.removeChild(loadingElement);
                }

                if (response.ok) {
                    const data = await response.json();
                    
                    // Add agent response
                    const agentMsg = document.createElement('div');
                    agentMsg.className = 'message agent mb-4';
                    agentMsg.innerHTML = `
                        <div class="bg-blue-100 rounded-lg p-3 inline-block max-w-xs">
                            <p class="text-gray-800 text-sm">${data.response}</p>
                            <div class="text-xs text-gray-500 mt-1 text-right">${getCurrentTime()}</div>
                        </div>`;
                    chat.appendChild(agentMsg);
                    
                } else {
                    throw new Error('API error: ' + response.status);
                }
            } catch (error) {
                // Remove loading indicator
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    chat.removeChild(loadingElement);
                }
                
                // Add error message
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message agent mb-4';
                errorMsg.innerHTML = `
                    <div class="bg-red-100 rounded-lg p-3 inline-block max-w-xs">
                        <p class="text-red-800 text-sm">Извините, произошла ошибка при подключении к агенту. Попробуйте позже.</p>
                        <div class="text-xs text-red-500 mt-1 text-right">${getCurrentTime()}</div>
                    </div>`;
                chat.appendChild(errorMsg);
                
                console.error('Chat API error:', error);
            }
            
            // Scroll to bottom
            scrollToBottom();
        }
        
        function getCurrentTime() {
            return new Date().toLocaleTimeString('ru', {hour: '2-digit', minute:'2-digit'});
        }
        
        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }
        
        // Event listeners
        button.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Initial focus
        input.focus();
    </script>
</body>
</html>
